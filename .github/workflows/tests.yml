name: tests

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types:
      - exact_sha_validation_requested

permissions:
  contents: read

jobs:
  ci:
    name: ${{ github.event_name == 'repository_dispatch' && 'exact-SHA candidate validation' || 'ci' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kpone_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kpone_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kpone_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: prefer
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Validate pull-request candidate
        if: github.event_name == 'pull_request'
        id: validate_pr_candidate
        shell: bash
        env:
          PR_HEAD_SHA_JSON: ${{ toJSON(github.event.pull_request.head.sha) }}
          PR_BASE_SHA_JSON: ${{ toJSON(github.event.pull_request.base.sha) }}
          PR_NUMBER_JSON: ${{ toJSON(github.event.pull_request.number) }}
          SYNTHETIC_MERGE_SHA_JSON: ${{ toJSON(github.sha) }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            echo 'Pull-request candidate validation requires a pull_request event.' >&2
            exit 1
          fi

          for input in "$PR_HEAD_SHA_JSON" "$PR_BASE_SHA_JSON" "$SYNTHETIC_MERGE_SHA_JSON"; do
            if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$input" >/dev/null; then
              echo 'Pull-request commit identities must be full lowercase 40-character hexadecimal SHAs.' >&2
              exit 1
            fi
          done

          if ! jq -e 'type == "number" and . > 0 and floor == .' <<<"$PR_NUMBER_JSON" >/dev/null; then
            echo 'Pull-request number must be a positive integer.' >&2
            exit 1
          fi

          candidate_sha="$(jq -er '.' <<<"$PR_HEAD_SHA_JSON")"
          base_sha="$(jq -er '.' <<<"$PR_BASE_SHA_JSON")"
          pr_number="$(jq -er 'tostring' <<<"$PR_NUMBER_JSON")"
          synthetic_merge_sha="$(jq -er '.' <<<"$SYNTHETIC_MERGE_SHA_JSON")"
          synthetic_merge_ref="refs/pull/$pr_number/merge"

          if [[ "$GITHUB_REF" != "$synthetic_merge_ref" ]]; then
            echo 'The pull_request event is not associated with its expected synthetic merge ref.' >&2
            exit 1
          fi

          {
            echo "candidate_sha=$candidate_sha"
            echo "base_sha=$base_sha"
            echo "pr_number=$pr_number"
            echo "synthetic_merge_sha=$synthetic_merge_sha"
            echo "synthetic_merge_ref=$synthetic_merge_ref"
          } >>"$GITHUB_OUTPUT"

      - name: Validate exact-SHA request
        if: github.event_name == 'repository_dispatch' && github.event.action == 'exact_sha_validation_requested'
        id: validate_candidate
        shell: bash
        env:
          CANDIDATE_REF_JSON: ${{ toJSON(github.event.client_payload.candidate_ref) }}
          CANDIDATE_SHA_JSON: ${{ toJSON(github.event.client_payload.candidate_sha) }}
          CANDIDATE_TREE_JSON: ${{ toJSON(github.event.client_payload.candidate_tree) }}
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != 'repository_dispatch' || "$EVENT_ACTION" != 'exact_sha_validation_requested' ]]; then
            echo 'Exact-SHA validation requires the approved repository_dispatch event type.' >&2
            exit 1
          fi

          github_api() {
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          repository_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY")"
          repository_full_name="$(jq -er '.full_name | select(type == "string" and length > 0)' <<<"$repository_json")"
          default_branch="$(jq -er '.default_branch | select(type == "string" and length > 0)' <<<"$repository_json")"

          if [[ "$repository_full_name" != "$GITHUB_REPOSITORY" ]]; then
            echo 'GitHub API repository identity does not match the workflow repository.' >&2
            exit 1
          fi

          if ! git check-ref-format --branch "$default_branch" >/dev/null; then
            echo 'The repository default branch is not a valid Git branch name.' >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/heads/$default_branch" ]]; then
            echo 'repository_dispatch is not associated with the repository default branch.' >&2
            exit 1
          fi

          if [[ "$GITHUB_WORKFLOW_SHA" != "$GITHUB_SHA" ]]; then
            echo 'The workflow definition does not match the repository_dispatch commit context.' >&2
            exit 1
          fi

          if ! jq -e '
            type == "string"
            and test("^validation/[A-Za-z0-9][A-Za-z0-9._/-]*$")
            and (explode | all(. >= 32 and . < 127))
          ' <<<"$CANDIDATE_REF_JSON" >/dev/null; then
            echo 'candidate_ref must be a non-empty validation/* string using only safe Git ref characters.' >&2
            exit 1
          fi

          if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$CANDIDATE_SHA_JSON" >/dev/null; then
            echo 'candidate_sha must be a full lowercase 40-character hexadecimal string.' >&2
            exit 1
          fi

          if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$CANDIDATE_TREE_JSON" >/dev/null; then
            echo 'candidate_tree must be a full lowercase 40-character hexadecimal string.' >&2
            exit 1
          fi

          CANDIDATE_REF="$(jq -er '.' <<<"$CANDIDATE_REF_JSON")"
          CANDIDATE_SHA="$(jq -er '.' <<<"$CANDIDATE_SHA_JSON")"
          CANDIDATE_TREE="$(jq -er '.' <<<"$CANDIDATE_TREE_JSON")"

          if ! git check-ref-format --branch "$CANDIDATE_REF" >/dev/null; then
            echo 'candidate_ref is not a valid Git branch name.' >&2
            exit 1
          fi

          ref_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_REF")"
          remote_type="$(jq -er '.object.type' <<<"$ref_json")"
          remote_sha="$(jq -er '.object.sha' <<<"$ref_json")"

          if [[ "$remote_type" != 'commit' || "$remote_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'The remote validation branch does not resolve to candidate_sha.' >&2
            exit 1
          fi

          commit_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits/$CANDIDATE_SHA")"
          resolved_sha="$(jq -er '.sha' <<<"$commit_json")"
          resolved_tree="$(jq -er '.tree.sha' <<<"$commit_json")"

          if [[ "$resolved_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'candidate_sha did not resolve to the requested commit.' >&2
            exit 1
          fi

          if [[ "$resolved_tree" != "$CANDIDATE_TREE" ]]; then
            echo 'candidate_tree does not match candidate_sha.' >&2
            exit 1
          fi

          echo "candidate_sha=$CANDIDATE_SHA" >>"$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        if: github.event_name == 'repository_dispatch' && github.event.action == 'exact_sha_validation_requested'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.validate_candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Checkout exact pull-request candidate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.validate_pr_candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout code
        if: github.event_name != 'repository_dispatch' && github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attest pull-request checkout and integration
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.validate_pr_candidate.outputs.candidate_sha }}
          EXPECTED_BASE_SHA: ${{ steps.validate_pr_candidate.outputs.base_sha }}
          EXPECTED_PR_NUMBER: ${{ steps.validate_pr_candidate.outputs.pr_number }}
          EXPECTED_SYNTHETIC_MERGE_SHA: ${{ steps.validate_pr_candidate.outputs.synthetic_merge_sha }}
          EXPECTED_SYNTHETIC_MERGE_REF: ${{ steps.validate_pr_candidate.outputs.synthetic_merge_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for sha in "$EXPECTED_CANDIDATE_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_SYNTHETIC_MERGE_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Pull-request attestation received an invalid commit SHA.' >&2
              exit 1
            fi
          done

          if [[ ! "$EXPECTED_SYNTHETIC_MERGE_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]; then
            echo 'Pull-request attestation received an invalid synthetic merge ref.' >&2
            exit 1
          fi

          if [[ ! "$EXPECTED_PR_NUMBER" =~ ^[1-9][0-9]*$ || "$EXPECTED_SYNTHETIC_MERGE_REF" != "refs/pull/$EXPECTED_PR_NUMBER/merge" ]]; then
            echo 'Pull-request attestation received an invalid or inconsistent pull-request number.' >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git show -s --format=%T HEAD)"

          if ! git cat-file -e "$EXPECTED_BASE_SHA^{commit}"; then
            echo 'The authoritative pull-request base commit is unavailable after checkout.' >&2
            exit 1
          fi

          merge_base="$(git merge-base "$actual_sha" "$EXPECTED_BASE_SHA")"
          pull_request_json="$(
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR_NUMBER"
          )"
          current_pr_state="$(jq -er '.state' <<<"$pull_request_json")"
          if ! jq -e '.merged | type == "boolean"' <<<"$pull_request_json" >/dev/null; then
            echo 'The current pull-request response does not contain a valid merged state.' >&2
            exit 1
          fi
          current_pr_merged="$(jq -r '.merged | tostring' <<<"$pull_request_json")"
          current_pr_head_sha="$(jq -er '.head.sha' <<<"$pull_request_json")"
          current_pr_base_sha="$(jq -er '.base.sha' <<<"$pull_request_json")"
          current_pr_merge_sha="$(jq -er '.merge_commit_sha' <<<"$pull_request_json")"

          synthetic_merge_json="$(
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_SYNTHETIC_MERGE_SHA"
          )"
          resolved_merge_sha="$(jq -er '.sha' <<<"$synthetic_merge_json")"
          synthetic_merge_tree="$(jq -er '.tree.sha' <<<"$synthetic_merge_json")"
          synthetic_parent_count="$(jq -er '.parents | length' <<<"$synthetic_merge_json")"
          synthetic_parent_one="$(jq -er '.parents[0].sha' <<<"$synthetic_merge_json")"
          synthetic_parent_two="$(jq -er '.parents[1].sha' <<<"$synthetic_merge_json")"

          for sha in "$actual_sha" "$candidate_tree" "$merge_base" "$current_pr_head_sha" "$current_pr_base_sha" "$current_pr_merge_sha" "$resolved_merge_sha" "$synthetic_merge_tree" "$synthetic_parent_one" "$synthetic_parent_two"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Pull-request attestation resolved an invalid Git object identity.' >&2
              exit 1
            fi
          done

          printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
          printf 'Expected candidate SHA: %s\n' "$EXPECTED_CANDIDATE_SHA"
          printf 'Actual checked-out SHA: %s\n' "$actual_sha"
          printf 'Candidate tree: %s\n' "$candidate_tree"
          printf 'PR base SHA: %s\n' "$EXPECTED_BASE_SHA"
          printf 'Merge base: %s\n' "$merge_base"
          printf 'Current PR head SHA: %s\n' "$current_pr_head_sha"
          printf 'Current PR base SHA: %s\n' "$current_pr_base_sha"
          printf 'Synthetic merge ref: %s\n' "$EXPECTED_SYNTHETIC_MERGE_REF"
          printf 'Synthetic merge SHA: %s\n' "$resolved_merge_sha"
          printf 'Synthetic merge parent 1: %s\n' "$synthetic_parent_one"
          printf 'Synthetic merge parent 2: %s\n' "$synthetic_parent_two"
          printf 'Synthetic merge tree: %s\n' "$synthetic_merge_tree"

          if [[ "$actual_sha" != "$EXPECTED_CANDIDATE_SHA" ]]; then
            echo 'Checked-out SHA does not match the authoritative pull-request head SHA.' >&2
            exit 1
          fi

          if [[ "$merge_base" != "$EXPECTED_BASE_SHA" ]]; then
            echo 'The authoritative pull-request base is not the candidate merge base.' >&2
            exit 1
          fi

          if [[ "$current_pr_state" != 'open' || "$current_pr_merged" != 'false' ]]; then
            echo 'The pull request is no longer open and unmerged.' >&2
            exit 1
          fi

          if [[ "$current_pr_head_sha" != "$EXPECTED_CANDIDATE_SHA" || "$current_pr_base_sha" != "$EXPECTED_BASE_SHA" || "$current_pr_merge_sha" != "$EXPECTED_SYNTHETIC_MERGE_SHA" ]]; then
            echo 'The pull-request head, base, or synthetic merge moved after the event was created.' >&2
            exit 1
          fi

          if [[ "$resolved_merge_sha" != "$EXPECTED_SYNTHETIC_MERGE_SHA" || "$synthetic_parent_count" != '2' ]]; then
            echo 'The synthetic merge commit is missing or has an unexpected identity or parent count.' >&2
            exit 1
          fi

          if [[ "$synthetic_parent_one" != "$EXPECTED_BASE_SHA" || "$synthetic_parent_two" != "$EXPECTED_CANDIDATE_SHA" ]]; then
            echo 'The synthetic merge parents do not match the authoritative pull-request base and head.' >&2
            exit 1
          fi

          if [[ "$synthetic_merge_tree" != "$candidate_tree" ]]; then
            echo 'The synthetic merge tree is not content-equivalent to the reviewed candidate tree.' >&2
            exit 1
          fi

          echo 'Candidate and synthetic merge trees are content-equivalent.'

      - name: Attest exact checkout
        if: github.event_name == 'repository_dispatch' && github.event.action == 'exact_sha_validation_requested'
        shell: bash
        env:
          CANDIDATE_REF_JSON: ${{ toJSON(github.event.client_payload.candidate_ref) }}
          CANDIDATE_SHA_JSON: ${{ toJSON(github.event.client_payload.candidate_sha) }}
          CANDIDATE_TREE_JSON: ${{ toJSON(github.event.client_payload.candidate_tree) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! jq -e '
            type == "string"
            and test("^validation/[A-Za-z0-9][A-Za-z0-9._/-]*$")
            and (explode | all(. >= 32 and . < 127))
          ' <<<"$CANDIDATE_REF_JSON" >/dev/null; then
            echo 'candidate_ref changed or became invalid before checkout attestation.' >&2
            exit 1
          fi

          if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$CANDIDATE_SHA_JSON" >/dev/null; then
            echo 'candidate_sha changed or became invalid before checkout attestation.' >&2
            exit 1
          fi

          if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$CANDIDATE_TREE_JSON" >/dev/null; then
            echo 'candidate_tree changed or became invalid before checkout attestation.' >&2
            exit 1
          fi

          CANDIDATE_REF="$(jq -er '.' <<<"$CANDIDATE_REF_JSON")"
          CANDIDATE_SHA="$(jq -er '.' <<<"$CANDIDATE_SHA_JSON")"
          CANDIDATE_TREE="$(jq -er '.' <<<"$CANDIDATE_TREE_JSON")"

          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git show -s --format=%T HEAD)"
          ref_json="$(
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_REF"
          )"
          remote_type="$(jq -er '.object.type' <<<"$ref_json")"
          remote_sha="$(jq -er '.object.sha' <<<"$ref_json")"

          printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
          printf 'Validation ref: %s\n' "$CANDIDATE_REF"
          printf 'Requested SHA: %s\n' "$CANDIDATE_SHA"
          printf 'Actual SHA: %s\n' "$actual_sha"
          printf 'Expected tree: %s\n' "$CANDIDATE_TREE"
          printf 'Actual tree: %s\n' "$actual_tree"

          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'Checked-out SHA does not match candidate_sha.' >&2
            exit 1
          fi

          if [[ "$actual_tree" != "$CANDIDATE_TREE" ]]; then
            echo 'Checked-out tree does not match candidate_tree.' >&2
            exit 1
          fi

          if [[ "$remote_type" != 'commit' || "$remote_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'The remote validation branch moved before checkout attestation.' >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare ephemeral CI environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Run frontend behavior tests
        shell: bash
        run: |
          shopt -s failglob
          node --test tests/Frontend/*.test.mjs

      - name: Migrate isolated test database
        run: php artisan migrate --force

      - name: Build frontend assets
        run: npm run build

      - name: Run CI Checks
        run: composer ci:check
