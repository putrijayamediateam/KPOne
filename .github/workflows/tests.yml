name: tests

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types:
      - exact_sha_validation_requested

permissions:
  contents: read
  pull-requests: read

# CI-PAR-1: a new push to a pull request cancels that pull request's older run. Pushes to main and exact-SHA
# validation dispatches each keep their own group (the run id), so they are never cancelled.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI-SPLIT: validates and attests the candidate once, then hands its SHA to the other jobs, so a stale or moved
  # pull request fails here, in about a minute, before any test runner starts.
  attest:
    name: attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}

    steps:
      - name: Validate pull-request candidate
        if: github.event_name == 'pull_request'
        id: validate_pr_candidate
        shell: bash
        env:
          PR_HEAD_SHA_JSON: ${{ toJSON(github.event.pull_request.head.sha) }}
          PR_BASE_SHA_JSON: ${{ toJSON(github.event.pull_request.base.sha) }}
          PR_NUMBER_JSON: ${{ toJSON(github.event.pull_request.number) }}
          SYNTHETIC_MERGE_SHA_JSON: ${{ toJSON(github.sha) }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            echo 'Pull-request candidate validation requires a pull_request event.' >&2
            exit 1
          fi

          for input in "$PR_HEAD_SHA_JSON" "$PR_BASE_SHA_JSON" "$SYNTHETIC_MERGE_SHA_JSON"; do
            if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$input" >/dev/null; then
              echo 'Pull-request commit identities must be full lowercase 40-character hexadecimal SHAs.' >&2
              exit 1
            fi
          done

          if ! jq -e 'type == "number" and . > 0 and floor == .' <<<"$PR_NUMBER_JSON" >/dev/null; then
            echo 'Pull-request number must be a positive integer.' >&2
            exit 1
          fi

          candidate_sha="$(jq -er '.' <<<"$PR_HEAD_SHA_JSON")"
          base_sha="$(jq -er '.' <<<"$PR_BASE_SHA_JSON")"
          pr_number="$(jq -er 'tostring' <<<"$PR_NUMBER_JSON")"
          synthetic_merge_sha="$(jq -er '.' <<<"$SYNTHETIC_MERGE_SHA_JSON")"
          synthetic_merge_ref="refs/pull/$pr_number/merge"

          if [[ "$GITHUB_REF" != "$synthetic_merge_ref" ]]; then
            echo 'The pull_request event is not associated with its expected synthetic merge ref.' >&2
            exit 1
          fi

          {
            echo "candidate_sha=$candidate_sha"
            echo "base_sha=$base_sha"
            echo "pr_number=$pr_number"
            echo "synthetic_merge_sha=$synthetic_merge_sha"
            echo "synthetic_merge_ref=$synthetic_merge_ref"
          } >>"$GITHUB_OUTPUT"

      - name: Validate exact-SHA request
        if: github.event_name == 'repository_dispatch' && github.event.action == 'exact_sha_validation_requested'
        id: validate_candidate
        shell: bash
        env:
          CANDIDATE_REF_JSON: ${{ toJSON(github.event.client_payload.candidate_ref) }}
          CANDIDATE_SHA_JSON: ${{ toJSON(github.event.client_payload.candidate_sha) }}
          CANDIDATE_TREE_JSON: ${{ toJSON(github.event.client_payload.candidate_tree) }}
          EVENT_ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != 'repository_dispatch' || "$EVENT_ACTION" != 'exact_sha_validation_requested' ]]; then
            echo 'Exact-SHA validation requires the approved repository_dispatch event type.' >&2
            exit 1
          fi

          github_api() {
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          repository_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY")"
          repository_full_name="$(jq -er '.full_name | select(type == "string" and length > 0)' <<<"$repository_json")"
          default_branch="$(jq -er '.default_branch | select(type == "string" and length > 0)' <<<"$repository_json")"

          if [[ "$repository_full_name" != "$GITHUB_REPOSITORY" ]]; then
            echo 'GitHub API repository identity does not match the workflow repository.' >&2
            exit 1
          fi

          if ! git check-ref-format --branch "$default_branch" >/dev/null; then
            echo 'The repository default branch is not a valid Git branch name.' >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/heads/$default_branch" ]]; then
            echo 'repository_dispatch is not associated with the repository default branch.' >&2
            exit 1
          fi

          if [[ "$GITHUB_WORKFLOW_SHA" != "$GITHUB_SHA" ]]; then
            echo 'The workflow definition does not match the repository_dispatch commit context.' >&2
            exit 1
          fi

          if ! jq -e '
            type == "string"
            and test("^validation/[A-Za-z0-9][A-Za-z0-9._/-]*$")
            and (explode | all(. >= 32 and . < 127))
          ' <<<"$CANDIDATE_REF_JSON" >/dev/null; then
            echo 'candidate_ref must be a non-empty validation/* string using only safe Git ref characters.' >&2
            exit 1
          fi

          if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$CANDIDATE_SHA_JSON" >/dev/null; then
            echo 'candidate_sha must be a full lowercase 40-character hexadecimal string.' >&2
            exit 1
          fi

          if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$CANDIDATE_TREE_JSON" >/dev/null; then
            echo 'candidate_tree must be a full lowercase 40-character hexadecimal string.' >&2
            exit 1
          fi

          CANDIDATE_REF="$(jq -er '.' <<<"$CANDIDATE_REF_JSON")"
          CANDIDATE_SHA="$(jq -er '.' <<<"$CANDIDATE_SHA_JSON")"
          CANDIDATE_TREE="$(jq -er '.' <<<"$CANDIDATE_TREE_JSON")"

          if ! git check-ref-format --branch "$CANDIDATE_REF" >/dev/null; then
            echo 'candidate_ref is not a valid Git branch name.' >&2
            exit 1
          fi

          ref_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_REF")"
          remote_type="$(jq -er '.object.type' <<<"$ref_json")"
          remote_sha="$(jq -er '.object.sha' <<<"$ref_json")"

          if [[ "$remote_type" != 'commit' || "$remote_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'The remote validation branch does not resolve to candidate_sha.' >&2
            exit 1
          fi

          commit_json="$(github_api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits/$CANDIDATE_SHA")"
          resolved_sha="$(jq -er '.sha' <<<"$commit_json")"
          resolved_tree="$(jq -er '.tree.sha' <<<"$commit_json")"

          if [[ "$resolved_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'candidate_sha did not resolve to the requested commit.' >&2
            exit 1
          fi

          if [[ "$resolved_tree" != "$CANDIDATE_TREE" ]]; then
            echo 'candidate_tree does not match candidate_sha.' >&2
            exit 1
          fi

          echo "candidate_sha=$CANDIDATE_SHA" >>"$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        if: github.event_name == 'repository_dispatch' && github.event.action == 'exact_sha_validation_requested'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.validate_candidate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Checkout exact pull-request candidate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.validate_pr_candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout code
        if: github.event_name != 'repository_dispatch' && github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Attest pull-request checkout and integration
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ steps.validate_pr_candidate.outputs.candidate_sha }}
          EXPECTED_BASE_SHA: ${{ steps.validate_pr_candidate.outputs.base_sha }}
          EXPECTED_PR_NUMBER: ${{ steps.validate_pr_candidate.outputs.pr_number }}
          EXPECTED_SYNTHETIC_MERGE_SHA: ${{ steps.validate_pr_candidate.outputs.synthetic_merge_sha }}
          EXPECTED_SYNTHETIC_MERGE_REF: ${{ steps.validate_pr_candidate.outputs.synthetic_merge_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for sha in "$EXPECTED_CANDIDATE_SHA" "$EXPECTED_BASE_SHA" "$EXPECTED_SYNTHETIC_MERGE_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Pull-request attestation received an invalid commit SHA.' >&2
              exit 1
            fi
          done

          if [[ ! "$EXPECTED_SYNTHETIC_MERGE_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]]; then
            echo 'Pull-request attestation received an invalid synthetic merge ref.' >&2
            exit 1
          fi

          if [[ ! "$EXPECTED_PR_NUMBER" =~ ^[1-9][0-9]*$ || "$EXPECTED_SYNTHETIC_MERGE_REF" != "refs/pull/$EXPECTED_PR_NUMBER/merge" ]]; then
            echo 'Pull-request attestation received an invalid or inconsistent pull-request number.' >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git show -s --format=%T HEAD)"

          sanitize_api_value() {
            local value="$1"

            value="$(printf '%s' "$value" | LC_ALL=C tr -d '\000-\037\177')"
            printf '%s' "${value:0:512}"
          }

          response_header() {
            local headers_file="$1"
            local header_name="$2"

            awk -v sought="$header_name" '
              {
                sub(/\r$/, "")
                separator = index($0, ":")

                if (separator > 0 && tolower(substr($0, 1, separator - 1)) == tolower(sought)) {
                  value = substr($0, separator + 1)
                  sub(/^[[:space:]]+/, "", value)
                  found = value
                }
              }

              END {
                if (found != "") {
                  print found
                }
              }
            ' "$headers_file"
          }

          print_api_header() {
            local headers_file="$1"
            local output_name="$2"
            local header_name="$3"
            local value

            if ! value="$(response_header "$headers_file" "$header_name" 2>/dev/null)"; then
              value=''
            fi
            value="$(sanitize_api_value "$value")"

            if [[ -n "$value" ]]; then
              printf '%s=%s\n' "$output_name" "$value" >&2
            fi
          }

          report_api_failure() {
            local endpoint_label="$1"
            local curl_exit="$2"
            local http_status="$3"
            local headers_file="$4"
            local body_file="$5"
            local message='unavailable-or-non-json'
            local raw_message

            if raw_message="$(
              jq -er 'if type == "object" and (.message | type) == "string" then .message else empty end' "$body_file" 2>/dev/null \
                | LC_ALL=C tr -d '\000-\037\177'
            )"; then
              message="$(sanitize_api_value "$raw_message")"

              if [[ -z "$message" ]]; then
                message='unavailable-or-non-json'
              fi
            fi

            printf 'GitHub API request failed\n' >&2
            printf 'endpoint=%s\n' "$endpoint_label" >&2
            printf 'curl_exit=%s\n' "$curl_exit" >&2
            printf 'http_status=%s\n' "$http_status" >&2
            printf 'message=%s\n' "$message" >&2
            print_api_header "$headers_file" 'accepted_permissions' 'X-Accepted-GitHub-Permissions'
            print_api_header "$headers_file" 'oauth_scopes' 'X-OAuth-Scopes'
            print_api_header "$headers_file" 'rate_limit_limit' 'X-RateLimit-Limit'
            print_api_header "$headers_file" 'rate_limit_remaining' 'X-RateLimit-Remaining'
            print_api_header "$headers_file" 'rate_limit_used' 'X-RateLimit-Used'
            print_api_header "$headers_file" 'rate_limit_reset' 'X-RateLimit-Reset'
            print_api_header "$headers_file" 'rate_limit_resource' 'X-RateLimit-Resource'
            print_api_header "$headers_file" 'retry_after' 'Retry-After'
            print_api_header "$headers_file" 'github_request_id' 'X-GitHub-Request-Id'
          }

          github_api_request() {
            local endpoint_label="$1"
            local request_url="$2"
            local request_dir
            local headers_file
            local body_file
            local cleanup_trap
            local curl_exit=0
            local http_status
            local response_json

            if ! request_dir="$(mktemp -d)"; then
              printf 'GitHub API request failed\nendpoint=%s\ncurl_exit=1\nhttp_status=000\nmessage=temporary-storage-unavailable\n' "$endpoint_label" >&2
              return 1
            fi

            headers_file="$request_dir/headers"
            body_file="$request_dir/body"
            printf -v cleanup_trap 'rm -f -- %q %q; rmdir -- %q 2>/dev/null || true' "$headers_file" "$body_file" "$request_dir"
            trap "$cleanup_trap" EXIT
            : >"$headers_file"
            : >"$body_file"

            http_status="$(
              curl --fail-with-body --silent --location \
                --dump-header "$headers_file" \
                --output "$body_file" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$request_url"
            )" || curl_exit=$?

            if [[ ! "$http_status" =~ ^[0-9]{3}$ ]]; then
              http_status='000'
            fi

            if [[ "$curl_exit" -ne 0 || ! "$http_status" =~ ^2[0-9]{2}$ ]]; then
              report_api_failure "$endpoint_label" "$curl_exit" "$http_status" "$headers_file" "$body_file"
              rm -f -- "$headers_file" "$body_file"
              rmdir -- "$request_dir"
              trap - EXIT
              return 1
            fi

            if ! response_json="$(jq -c '.' "$body_file" 2>/dev/null)"; then
              report_api_failure "$endpoint_label" "$curl_exit" "$http_status" "$headers_file" "$body_file"
              rm -f -- "$headers_file" "$body_file"
              rmdir -- "$request_dir"
              trap - EXIT
              return 1
            fi

            rm -f -- "$headers_file" "$body_file"
            rmdir -- "$request_dir"
            trap - EXIT
            printf '%s\n' "$response_json"
          }

          if ! git cat-file -e "$EXPECTED_BASE_SHA^{commit}"; then
            echo 'The authoritative pull-request base commit is unavailable after checkout.' >&2
            exit 1
          fi

          merge_base="$(git merge-base "$actual_sha" "$EXPECTED_BASE_SHA")"
          pull_request_json="$(github_api_request \
            'pull-request-metadata' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$EXPECTED_PR_NUMBER")"
          current_pr_state="$(jq -er '.state' <<<"$pull_request_json")"
          if ! jq -e '.merged | type == "boolean"' <<<"$pull_request_json" >/dev/null; then
            echo 'The current pull-request response does not contain a valid merged state.' >&2
            exit 1
          fi
          current_pr_merged="$(jq -r '.merged | tostring' <<<"$pull_request_json")"
          current_pr_head_sha="$(jq -er '.head.sha' <<<"$pull_request_json")"
          current_pr_base_sha="$(jq -er '.base.sha' <<<"$pull_request_json")"
          current_pr_merge_sha="$(jq -er '.merge_commit_sha' <<<"$pull_request_json")"

          synthetic_merge_json="$(github_api_request \
            'synthetic-merge-commit' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_SYNTHETIC_MERGE_SHA")"
          resolved_merge_sha="$(jq -er '.sha' <<<"$synthetic_merge_json")"
          synthetic_merge_tree="$(jq -er '.tree.sha' <<<"$synthetic_merge_json")"
          synthetic_parent_count="$(jq -er '.parents | length' <<<"$synthetic_merge_json")"
          synthetic_parent_one="$(jq -er '.parents[0].sha' <<<"$synthetic_merge_json")"
          synthetic_parent_two="$(jq -er '.parents[1].sha' <<<"$synthetic_merge_json")"

          for sha in "$actual_sha" "$candidate_tree" "$merge_base" "$current_pr_head_sha" "$current_pr_base_sha" "$current_pr_merge_sha" "$resolved_merge_sha" "$synthetic_merge_tree" "$synthetic_parent_one" "$synthetic_parent_two"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Pull-request attestation resolved an invalid Git object identity.' >&2
              exit 1
            fi
          done

          printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
          printf 'Expected candidate SHA: %s\n' "$EXPECTED_CANDIDATE_SHA"
          printf 'Actual checked-out SHA: %s\n' "$actual_sha"
          printf 'Candidate tree: %s\n' "$candidate_tree"
          printf 'PR base SHA: %s\n' "$EXPECTED_BASE_SHA"
          printf 'Merge base: %s\n' "$merge_base"
          printf 'Current PR head SHA: %s\n' "$current_pr_head_sha"
          printf 'Current PR base SHA: %s\n' "$current_pr_base_sha"
          printf 'Synthetic merge ref: %s\n' "$EXPECTED_SYNTHETIC_MERGE_REF"
          printf 'Synthetic merge SHA: %s\n' "$resolved_merge_sha"
          printf 'Synthetic merge parent 1: %s\n' "$synthetic_parent_one"
          printf 'Synthetic merge parent 2: %s\n' "$synthetic_parent_two"
          printf 'Synthetic merge tree: %s\n' "$synthetic_merge_tree"

          if [[ "$actual_sha" != "$EXPECTED_CANDIDATE_SHA" ]]; then
            echo 'Checked-out SHA does not match the authoritative pull-request head SHA.' >&2
            exit 1
          fi

          if [[ "$merge_base" != "$EXPECTED_BASE_SHA" ]]; then
            echo 'The authoritative pull-request base is not the candidate merge base.' >&2
            exit 1
          fi

          if [[ "$current_pr_state" != 'open' || "$current_pr_merged" != 'false' ]]; then
            echo 'The pull request is no longer open and unmerged.' >&2
            exit 1
          fi

          if [[ "$current_pr_head_sha" != "$EXPECTED_CANDIDATE_SHA" || "$current_pr_base_sha" != "$EXPECTED_BASE_SHA" || "$current_pr_merge_sha" != "$EXPECTED_SYNTHETIC_MERGE_SHA" ]]; then
            echo 'The pull-request head, base, or synthetic merge moved after the event was created.' >&2
            exit 1
          fi

          if [[ "$resolved_merge_sha" != "$EXPECTED_SYNTHETIC_MERGE_SHA" || "$synthetic_parent_count" != '2' ]]; then
            echo 'The synthetic merge commit is missing or has an unexpected identity or parent count.' >&2
            exit 1
          fi

          if [[ "$synthetic_parent_one" != "$EXPECTED_BASE_SHA" || "$synthetic_parent_two" != "$EXPECTED_CANDIDATE_SHA" ]]; then
            echo 'The synthetic merge parents do not match the authoritative pull-request base and head.' >&2
            exit 1
          fi

          if [[ "$synthetic_merge_tree" != "$candidate_tree" ]]; then
            echo 'The synthetic merge tree is not content-equivalent to the reviewed candidate tree.' >&2
            exit 1
          fi

          echo 'Candidate and synthetic merge trees are content-equivalent.'

      - name: Attest exact checkout
        if: github.event_name == 'repository_dispatch' && github.event.action == 'exact_sha_validation_requested'
        shell: bash
        env:
          CANDIDATE_REF_JSON: ${{ toJSON(github.event.client_payload.candidate_ref) }}
          CANDIDATE_SHA_JSON: ${{ toJSON(github.event.client_payload.candidate_sha) }}
          CANDIDATE_TREE_JSON: ${{ toJSON(github.event.client_payload.candidate_tree) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! jq -e '
            type == "string"
            and test("^validation/[A-Za-z0-9][A-Za-z0-9._/-]*$")
            and (explode | all(. >= 32 and . < 127))
          ' <<<"$CANDIDATE_REF_JSON" >/dev/null; then
            echo 'candidate_ref changed or became invalid before checkout attestation.' >&2
            exit 1
          fi

          if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$CANDIDATE_SHA_JSON" >/dev/null; then
            echo 'candidate_sha changed or became invalid before checkout attestation.' >&2
            exit 1
          fi

          if ! jq -e 'type == "string" and test("^[0-9a-f]{40}$")' <<<"$CANDIDATE_TREE_JSON" >/dev/null; then
            echo 'candidate_tree changed or became invalid before checkout attestation.' >&2
            exit 1
          fi

          CANDIDATE_REF="$(jq -er '.' <<<"$CANDIDATE_REF_JSON")"
          CANDIDATE_SHA="$(jq -er '.' <<<"$CANDIDATE_SHA_JSON")"
          CANDIDATE_TREE="$(jq -er '.' <<<"$CANDIDATE_TREE_JSON")"

          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git show -s --format=%T HEAD)"
          ref_json="$(
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_REF"
          )"
          remote_type="$(jq -er '.object.type' <<<"$ref_json")"
          remote_sha="$(jq -er '.object.sha' <<<"$ref_json")"

          printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
          printf 'Validation ref: %s\n' "$CANDIDATE_REF"
          printf 'Requested SHA: %s\n' "$CANDIDATE_SHA"
          printf 'Actual SHA: %s\n' "$actual_sha"
          printf 'Expected tree: %s\n' "$CANDIDATE_TREE"
          printf 'Actual tree: %s\n' "$actual_tree"

          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'Checked-out SHA does not match candidate_sha.' >&2
            exit 1
          fi

          if [[ "$actual_tree" != "$CANDIDATE_TREE" ]]; then
            echo 'Checked-out tree does not match candidate_tree.' >&2
            exit 1
          fi

          if [[ "$remote_type" != 'commit' || "$remote_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'The remote validation branch moved before checkout attestation.' >&2
            exit 1
          fi

      # The one commit every other job checks out and verifies: the pull request head, the exact-SHA request's
      # commit, or the pushed commit.
      - name: Publish the attested candidate SHA
        id: candidate
        shell: bash
        env:
          PR_CANDIDATE_SHA: ${{ steps.validate_pr_candidate.outputs.candidate_sha }}
          DISPATCH_CANDIDATE_SHA: ${{ steps.validate_candidate.outputs.candidate_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          candidate_sha="${PR_CANDIDATE_SHA:-${DISPATCH_CANDIDATE_SHA:-$PUSH_SHA}}"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The candidate SHA is not a full lowercase 40-character hexadecimal string.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$candidate_sha" ]]; then
            echo 'The attest job checkout is not the candidate SHA.' >&2
            exit 1
          fi
          echo "candidate_sha=$candidate_sha" >>"$GITHUB_OUTPUT"

  # CI-SPLIT: everything that needs no database: lint, format, types, static analysis, frontend tests and the build.
  static:
    name: static
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.attest.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify HEAD is the attested candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.attest.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The attest job did not output a valid candidate SHA.' >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          printf 'Attested candidate: %s\nChecked out HEAD:   %s\n' "$CANDIDATE_SHA" "$actual_sha"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'This job checked out a commit other than the attested candidate.' >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Prepare ephemeral CI environment
        run: cp .env.example .env

      - name: Locate Composer cache
        id: composer_cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >>"$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint, format and types
        run: |
          npm run lint:check
          npm run format:check
          npm run types:check

      # composer ci:check used to lift Composer's 300-second process limit; these steps keep that.
      - name: PHP format (Pint)
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          php artisan config:clear --ansi
          composer lint:check

      - name: PHP static analysis (PHPStan)
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: composer types:check

      - name: Run frontend behavior tests
        shell: bash
        run: |
          shopt -s failglob
          node --test tests/Frontend/*.test.mjs

      - name: Build frontend assets
        run: npm run build

      # CI-SPLIT (b): the three shards' lists of tests must add up to the unsharded Unit, Feature and Contention
      # suites. Each backend shard then proves that it ran exactly the tests it was given.
      - name: Prove the shards hold every test exactly once
        shell: bash
        run: |
          set -euo pipefail
          count() { php vendor/bin/phpunit "$@" --list-tests | grep -c '^ - ' || true; }
          unsharded="$(count --testsuite=Unit,Feature,Contention)"
          sharded=0
          for shard in 1 2 3; do
            php scripts/ci/make-shard-config.php "$shard" 3 >/dev/null
            unit_feature="$(count --configuration=phpunit.shard.xml --testsuite=Shard)"
            contention="$(count --testsuite="Contention$shard")"
            echo "Shard $shard lists $unit_feature Unit/Feature tests and $contention Contention tests."
            sharded=$((sharded + unit_feature + contention))
          done
          echo "Unsharded: $unsharded. Sum of the shards: $sharded."
          test "$unsharded" -gt 0
          if [[ "$unsharded" -ne "$sharded" ]]; then
            echo 'The shards do not add up to the unsharded test count.' >&2
            exit 1
          fi

  # CI-SPLIT: the backend suite in three shards, each with its own PostgreSQL service. A shard runs its share of the
  # Unit and Feature files with four parallel processes, then its fixed share of the Contention files, serially.
  backend:
    name: backend (shard ${{ matrix.shard }})
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kpone_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kpone_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kpone_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: prefer
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.attest.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify HEAD is the attested candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.attest.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The attest job did not output a valid candidate SHA.' >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          printf 'Attested candidate: %s\nChecked out HEAD:   %s\n' "$CANDIDATE_SHA" "$actual_sha"
          if [[ "$actual_sha" != "$CANDIDATE_SHA" ]]; then
            echo 'This job checked out a commit other than the attested candidate.' >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Prepare ephemeral CI environment
        run: cp .env.example .env

      - name: Locate Composer cache
        id: composer_cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >>"$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer_cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Kept in every job that runs PHP tests: NoAiServiceGuardTest scans resources/js, including generated routes.
      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form --no-interaction

      # Four test processes each rebuild the full schema of their own database, sometimes at the same moment, which
      # overflows PostgreSQL's default lock table ("out of shared memory"). Raise it on this throwaway service
      # container only.
      - name: Raise the test database lock table for parallel tests
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" psql -U postgres -d kpone_test -c 'ALTER SYSTEM SET max_locks_per_transaction = 1024'
          docker restart "$PG_CONTAINER" >/dev/null
          for _ in $(seq 1 60); do
            docker exec "$PG_CONTAINER" pg_isready -U postgres -d kpone_test >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$PG_CONTAINER" psql -U postgres -d kpone_test -tAc 'SHOW max_locks_per_transaction' | grep -qx 1024

      - name: Migrate isolated test database
        run: php artisan migrate --force

      - name: Choose this shard's Unit and Feature files
        run: |
          mkdir -p reports
          php scripts/ci/make-shard-config.php ${{ matrix.shard }} 3

      # Four processes, each on its own database (kpone_test_test_1..4, created and migrated by Laravel).
      - name: Backend tests (Unit and Feature, parallel)
        run: >-
          php artisan test --parallel --processes=4 --configuration=phpunit.shard.xml --testsuite=Shard
          --log-junit=reports/unit-feature-${{ matrix.shard }}.xml

      # Tests whose worker subprocesses connect to kpone_test itself run here, serially and never skipped.
      - name: PostgreSQL contention tests (serial)
        run: >-
          php artisan test --testsuite=Contention${{ matrix.shard }}
          --log-junit=reports/contention-${{ matrix.shard }}.xml

      # CI-SPLIT (b, c): what this shard executed must equal what it was given, with nothing skipped except the
      # known Fortify registration tests (never in Contention).
      - name: Prove this shard ran every test it was given
        shell: bash
        run: |
          set -euo pipefail
          count() { php vendor/bin/phpunit "$@" --list-tests | grep -c '^ - ' || true; }
          php scripts/ci/verify-shards.php "$(count --configuration=phpunit.shard.xml --testsuite=Shard)" reports/unit-feature-${{ matrix.shard }}.xml
          php scripts/ci/verify-shards.php "$(count --testsuite=Contention${{ matrix.shard }})" reports/contention-${{ matrix.shard }}.xml

  # CI-SPLIT: the one required check. Keeps the name "ci" (or the exact-SHA name), so branch protection is unchanged.
  # It passes only when attest, static and every backend shard passed; the proofs that every test ran exactly once
  # live in static (the shard lists add up) and in each backend shard (it ran what it was given).
  ci:
    name: ${{ github.event_name == 'repository_dispatch' && 'exact-SHA candidate validation' || 'ci' }}
    needs: [attest, static, backend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Every job must have succeeded
        shell: bash
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$RESULTS_JSON" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo 'A required job did not succeed.' >&2
            exit 1
          fi
